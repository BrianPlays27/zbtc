<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zombie Trading Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🧟 Zombie Trading Calculator</h1>
            <p>Calculate Fair Trades & Item Values</p>
        </header>

        <main>
            <!-- Quick Value Lookup -->
            <section class="calculator-section">
                <h2>Item Value Lookup</h2>
                <div class="input-group">
                    <label for="item-name">Item Name:</label>
                    <input type="text" id="item-name" placeholder="Enter item name">
                </div>
                <button onclick="searchItem()">Search Value</button>
                <div id="item-result" class="result"></div>
                <div id="item-suggestions" class="suggestions"></div>
            </section>

            <!-- Trade Calculator -->
            <section class="calculator-section">
                <h2>Trade Value Calculator</h2>
                <div class="input-group">
                    <label for="offer-value">Your Offer Value:</label>
                    <input type="number" id="offer-value" min="0" step="0.01" placeholder="Total value of items offered">
                </div>
                <div class="input-group">
                    <label for="receive-value">Receive Value:</label>
                    <input type="number" id="receive-value" min="0" step="0.01" placeholder="Total value of items receiving">
                </div>
                <button onclick="calculateTrade()">Analyze Trade</button>
                <div id="trade-result" class="result"></div>
            </section>

            <!-- Bulk Trade Calculator -->
            <section class="calculator-section">
                <h2>Bulk Trade Calculator</h2>
                <div class="input-group">
                    <label for="item-price">Item Unit Price:</label>
                    <input type="number" id="item-price" min="0" step="0.01" placeholder="Price per item">
                </div>
                <div class="input-group">
                    <label for="quantity">Quantity:</label>
                    <input type="number" id="quantity" min="1" placeholder="Number of items">
                </div>
                <div class="input-group">
                    <label for="discount-percent">Discount (%):</label>
                    <input type="number" id="discount-percent" min="0" max="100" step="0.1" value="0" placeholder="Bulk discount percentage">
                </div>
                <button onclick="calculateBulk()">Calculate</button>
                <div id="bulk-result" class="result"></div>
            </section>

            <!-- Profit Calculator -->
            <section class="calculator-section">
                <h2>Profit Calculator</h2>
                <div class="input-group">
                    <label for="buy-price">Buy Price:</label>
                    <input type="number" id="buy-price" min="0" step="0.01" placeholder="Price you paid">
                </div>
                <div class="input-group">
                    <label for="sell-price">Sell Price:</label>
                    <input type="number" id="sell-price" min="0" step="0.01" placeholder="Price you're selling for">
                </div>
                <div class="input-group">
                    <label for="quantity-profit">Quantity:</label>
                    <input type="number" id="quantity-profit" min="1" placeholder="Number of items">
                </div>
                <button onclick="calculateProfit()">Calculate</button>
                <div id="profit-result" class="result"></div>
            </section>

            <!-- Trade History -->
            <section class="calculator-section">
                <h2>Trade History & ROI</h2>
                <div class="input-group">
                    <label for="initial-investment">Initial Investment:</label>
                    <input type="number" id="initial-investment" min="0" step="0.01" placeholder="Starting capital">
                </div>
                <div class="input-group">
                    <label for="current-value">Current Portfolio Value:</label>
                    <input type="number" id="current-value" min="0" step="0.01" placeholder="What your items are worth now">
                </div>
                <button onclick="calculateROI()">Calculate ROI</button>
                <div id="roi-result" class="result"></div>
            </section>

            <!-- Multi-Item Trade Comparison -->
            <section class="calculator-section full-width">
                <h2>Multi-Item Trade Comparison</h2>
                <div id="trade-items-container">
                    <div class="trade-item-row">
                        <div class="input-group">
                            <label>Your Items (Offering):</label>
                            <input type="text" class="offer-item" placeholder="Item name" maxlength="30">
                            <input type="number" class="offer-qty" placeholder="Qty" min="1" value="1">
                            <input type="number" class="offer-value" placeholder="Price each" min="0" step="0.01">
                        </div>
                    </div>
                </div>
                <button onclick="addTradeRow('offer')">+ Add Item (Offering)</button>
                
                <div id="trade-receive-container" style="margin-top: 20px;">
                    <div class="trade-item-row">
                        <div class="input-group">
                            <label>Items Receiving:</label>
                            <input type="text" class="receive-item" placeholder="Item name" maxlength="30">
                            <input type="number" class="receive-qty" placeholder="Qty" min="1" value="1">
                            <input type="number" class="receive-value" placeholder="Price each" min="0" step="0.01">
                        </div>
                    </div>
                </div>
                <button onclick="addTradeRow('receive')">+ Add Item (Receiving)</button>
                
                <button onclick="compareMultiTrade()" style="margin-top: 20px;">Compare Trade</button>
                <div id="multi-trade-result" class="result"></div>
            </section>
        </main>

        <footer>
            <p>Trade smart. Profit big. 🧟‍♂️💰</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
